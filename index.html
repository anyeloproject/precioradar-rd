<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrecioRadar RD | Compara precios en República Dominicana</title>
  <meta name="description" content="Compara precios de productos en tiendas dominicanas. Encuentra ofertas y visita directamente cada tienda.">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #172033;
    }

    header {
      background: #10264a;
      color: white;
      padding: 28px 18px;
    }

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 0 16px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      color: #d6e2f5;
    }

    main { padding: 24px 0 45px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat {
      background: white;
      border-radius: 12px;
      padding: 17px;
      box-shadow: 0 2px 8px #15294a0d;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      color: #1558bd;
    }

    .stat span {
      color: #68758a;
      font-size: 13px;
    }

    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #d9dfeb;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 14px;
      background: white;
    }

    .filters {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .filter {
      border: 1px solid #d9dfeb;
      border-radius: 20px;
      padding: 9px 15px;
      background: white;
      color: #34445e;
      cursor: pointer;
    }

    .filter.active {
      background: #1558bd;
      color: white;
      border-color: #1558bd;
    }

    #status {
      color: #68758a;
      margin: 12px 0;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 17px;
    }

    .product {
      background: white;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 3px 12px #15294a12;
      border: 1px solid #e9edf4;
    }

    .product-image {
      height: 190px;
      background: #f8f9fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .product-image img {
      max-width: 100%;
      max-height: 165px;
      object-fit: contain;
    }

    .product-body { padding: 15px; }

    .product h3 {
      font-size: 16px;
      line-height: 1.4;
      margin: 0 0 7px;
    }

    .muted {
      color: #748095;
      font-size: 13px;
    }

    .offer {
      border-top: 1px solid #edf0f5;
      margin-top: 14px;
      padding-top: 13px;
    }

    .offer-store {
      font-weight: bold;
      font-size: 14px;
    }

    .offer-price {
      color: #1558bd;
      font-weight: bold;
      font-size: 23px;
      margin: 7px 0;
    }

    .old-price {
      color: #8993a3;
      font-size: 13px;
      text-decoration: line-through;
      margin-left: 6px;
    }

    .buy-link {
      display: block;
      text-align: center;
      background: #10264a;
      color: white;
      padding: 12px;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 14px;
      font-weight: bold;
    }

    .buy-link:hover { background: #1558bd; }

    .empty {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      color: #68758a;
      grid-column: 1 / -1;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #748095;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 25px; }
      .stats { gap: 8px; }
      .stat { padding: 12px; }
      .stat strong { font-size: 21px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .product-image { height: 145px; }
      .product-body { padding: 11px; }
      .product h3 { font-size: 14px; }
      .offer-price { font-size: 19px; }
      .buy-link { font-size: 12px; padding: 10px 5px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <h1>📡 PrecioRadar RD</h1>
      <p>Compara precios. Encuentra mejores ofertas. Compra directamente.</p>
    </div>
  </header>

  <main class="container">
    <section class="stats">
      <div class="stat">
        <strong id="totalProducts">—</strong>
        <span>Productos</span>
      </div>
      <div class="stat">
        <strong id="totalStores">—</strong>
        <span>Tiendas</span>
      </div>
      <div class="stat">
        <strong id="totalOffers">—</strong>
        <span>Ofertas registradas</span>
      </div>
    </section>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Buscar televisores, celulares, neveras, laptops..."
    >

    <div class="filters">
      <button class="filter active" data-category="Todas">Todas</button>
      <button class="filter" data-category="TV y Tecnología">TV y Tecnología</button>
      <button class="filter" data-category="Electro Hogar">Electro Hogar</button>
    </div>

    <p id="status">Conectando con PrecioRadar RD...</p>
    <section id="products" class="grid"></section>
  </main>

  <footer>
    PrecioRadar RD · Comparación de precios de tiendas dominicanas
  </footer>

  <script>
    const SUPABASE_URL = "https://igitecomybuxyrnyemfd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_VlXgJFn-c0T3UqLc9rG8WQ_T2pAtYnG";

    let allProducts = [];
    let selectedCategory = "Todas";

    async function api(table, params = {}) {
      const url = new URL(`${SUPABASE_URL}/rest/v1/${table}`);

      Object.entries(params).forEach(([key, value]) => {
        url.searchParams.set(key, value);
      });

      const response = await fetch(url, {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      });

      if (!response.ok) {
        throw new Error(`Error consultando ${table}: ${response.status}`);
      }

      return response.json();
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function safeUrl(value) {
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";
      }
    }

    function money(value) {
      if (value === null || value === undefined || value === "") {
        return "Precio no disponible";
      }

      return new Intl.NumberFormat("es-DO", {
        style: "currency",
        currency: "DOP",
        maximumFractionDigits: 2
      }).format(Number(value));
    }

    async function loadData() {
      const status = document.getElementById("status");

      try {
        status.textContent = "Cargando productos y ofertas...";

        const products = await api("products", {
          select: "id,name,brand,model,category,image_url",
          order: "name.asc",
          limit: "1000"
        });

        allProducts = products;

        if (!products.length) {
          document.getElementById("totalProducts").textContent = "0";
          document.getElementById("totalStores").textContent = "0";
          document.getElementById("totalOffers").textContent = "0";

          status.textContent = "Todavía no hay productos registrados.";
          renderProducts();
          return;
        }

        const ids = products.map(p => p.id);

        const listings = await api("listings", {
          select: "id,product_id,store_id,product_url,availability",
          product_id: `in.(${ids.join(",")})`,
          limit: "2000"
        });

        const storeIds = [...new Set(listings.map(l => l.store_id).filter(Boolean))];
        const listingIds = listings.map(l => l.id);

        let stores = [];
        let history = [];

        if (storeIds.length) {
          stores = await api("stores", {
            select: "id,name",
            id: `in.(${storeIds.join(",")})`,
            limit: "500"
          });
        }

        if (listingIds.length) {
          history = await api("price_history", {
            select: "listing_id,price,original_price,captured_at",
            listing_id: `in.(${listingIds.join(",")})`,
            order: "captured_at.desc",
            limit: "5000"
          });
        }

        const storeMap = new Map(stores.map(s => [String(s.id), s.name]));
        const latestPrice = new Map();

        for (const item of history) {
          const key = String(item.listing_id);

          if (!latestPrice.has(key)) {
            latestPrice.set(key, item);
          }
        }

        const offersByProduct = new Map();

        for (const listing of listings) {
          const price = latestPrice.get(String(listing.id));

          const offer = {
            store: storeMap.get(String(listing.store_id)) || "Tienda",
            url: safeUrl(listing.product_url),
            availability: listing.availability,
            price: price?.price,
            originalPrice: price?.original_price
          };

          const key = String(listing.product_id);

          if (!offersByProduct.has(key)) {
            offersByProduct.set(key, []);
          }

          offersByProduct.get(key).push(offer);
        }

        allProducts = products.map(product => ({
          ...product,
          offers: (offersByProduct.get(String(product.id)) || [])
            .sort((a, b) => {
              const pa = Number(a.price);
              const pb = Number(b.price);

              if (!Number.isFinite(pa)) return 1;
              if (!Number.isFinite(pb)) return -1;
              return pa - pb;
            })
        }));

        document.getElementById("totalProducts").textContent = products.length;
        document.getElementById("totalStores").textContent = stores.length;
        document.getElementById("totalOffers").textContent = listings.length;

        status.textContent = `${products.length} productos encontrados.`;
        renderProducts();

      } catch (error) {
        console.error(error);
        status.textContent = "No pudimos cargar los datos. Revisa la conexión con Supabase.";
      }
    }

    function renderProducts() {
      const search = document.getElementById("search").value
        .trim()
        .toLowerCase();

      const filtered = allProducts.filter(product => {
        const text = [
          product.name,
          product.brand,
          product.model
        ].join(" ").toLowerCase();

        const matchesSearch = text.includes(search);
        const matchesCategory =
          selectedCategory === "Todas" ||
          product.category === selectedCategory;

        return matchesSearch && matchesCategory;
      });

      const container = document.getElementById("products");

      if (!filtered.length) {
        container.innerHTML = `
          <div class="empty">
            No encontramos productos con esa búsqueda.
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(product => {
        const image = safeUrl(product.image_url);
        const offers = product.offers || [];

        return `
          <article class="product">
            <div class="product-image">
              ${image
                ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(product.name)}" loading="lazy">`
                : `<span class="muted">Imagen no disponible</span>`
              }
            </div>

            <div class="product-body">
              <h3>${escapeHTML(product.name)}</h3>

              <p class="muted">
                ${escapeHTML(product.brand || "")}
                ${product.model ? " · Modelo: " + escapeHTML(product.model) : ""}
              </p>

              ${
                offers.length
                  ? offers.map(offer => `
                    <div class="offer">
                      <div class="offer-store">${escapeHTML(offer.store)}</div>

                      <div class="offer-price">
                        ${money(offer.price)}
                        ${
                          offer.originalPrice &&
                          Number(offer.originalPrice) > Number(offer.price)
                            ? `<span class="old-price">${money(offer.originalPrice)}</span>`
                            : ""
                        }
                      </div>

                      ${offer.availability
                        ? `<div class="muted">${escapeHTML(offer.availability)}</div>`
                        : ""
                      }

                      ${
                        offer.url
                          ? `<a class="buy-link"
                               href="${escapeHTML(offer.url)}"
                               target="_blank"
                               rel="noopener noreferrer">
                               Ver producto en ${escapeHTML(offer.store)} ↗
                             </a>`
                          : `<p class="muted">Enlace no disponible</p>`
                      }
                    </div>
                  `).join("")
                  : `<div class="offer muted">Todavía no hay ofertas registradas.</div>`
              }
            </div>
          </article>
        `;
      }).join("");
    }

    document.getElementById("search").addEventListener("input", renderProducts);

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filter").forEach(b =>
          b.classList.remove("active")
        );

        button.classList.add("active");
        selectedCategory = button.dataset.category;
        renderProducts();
      });
    });

    loadData();
  </script>
</body>
</html>
